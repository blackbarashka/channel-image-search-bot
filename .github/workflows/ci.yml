name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check src run.py

      - name: Check formatting (Ruff)
        run: ruff format --check src run.py

      - name: Smoke test (import + config)
        env:
          # Формат токена aiogram: цифры:строка (реальный запрос к API не делаем)
          BOT_TOKEN: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
        run: |
          python -c "
          from src.config import BotConfig
          from src.bot import create_bot
          config = BotConfig.from_env()
          bot, dp = create_bot(config)
          assert bot is not None and dp is not None
          print('OK')
          "
