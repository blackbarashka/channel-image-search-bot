services:
  db:
    image: pgvector/pgvector:pg15
    container_name: tgbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tgbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tgbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: tgbot_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tgbot
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "src.bot"]

volumes:
  pgdata:
