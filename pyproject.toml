[project]
name = "channel-image-search-bot"
version = "0.1.0"
description = "Telegram bot for semantic image search in a channel"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.format]
quote-style = "double"
